<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Alles Gute zum Vatertag!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            touch-action: none;
        }
        
        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        .controls {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 15px;
            color: white;
            z-index: 100;
        }
        
        .controls h2 {
            margin: 0 0 10px 0;
            font-size: 18px;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .controls p {
            margin: 0 0 10px 0;
            font-size: 14px;
            text-align: center;
            opacity: 0.9;
        }
        
        .audio-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }
        
        button {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            -webkit-tap-highlight-color: transparent;
        }
        
        button:active {
            transform: scale(0.95);
        }
        
        #playBtn {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }
        
        .info {
            position: fixed;
            bottom: 20px;
            left: 0;
            right: 0;
            color: white;
            font-size: 12px;
            text-align: center;
            opacity: 0.8;
            pointer-events: none;
        }
        
        #loadingScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 20px;
            z-index: 1000;
        }
        
        .loader {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 480px) {
            .controls h2 {
                font-size: 16px;
            }
            
            .controls p {
                font-size: 12px;
            }
            
            button {
                padding: 10px 20px;
                font-size: 14px;
            }
        }
        
        /* iOS specific fixes */
        @supports (-webkit-touch-callout: none) {
            body {
                height: 100vh;
                height: -webkit-fill-available;
            }
            
            #canvas {
                height: 100vh;
                height: -webkit-fill-available;
            }
        }
    </style>
</head>
<body>
    <div id="loadingScreen">
        <div class="loader"></div>
        <div>Lade Vatertags-Überraschung...</div>
    </div>
    
    <canvas id="canvas"></canvas>
    
    <div class="controls">
        <h2>🎸 Alles Gute zum Vatertag, Papa! 🎸</h2>
        <p>Für den besten Papa der Welt! 💖</p>
        <div class="audio-controls">
            <button id="playBtn">🎵 Musik abspielen</button>
        </div>
    </div>
    
    <div class="info">
        Wischen zum Drehen • Pinch zum Zoomen
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let guitars = [];
        let papaText, babyGirl;
        let audioContext, audioSource, analyser, audioBuffer;
        let audioData;
        let isPlaying = false;
        let targetRotationX = 0;
        let targetRotationY = 0;
        let touchStartX = 0;
        let touchStartY = 0;
        let pinchStartDistance = 0;
        let initialCameraZ = 20;
        
        // Initialize Three.js
        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x2a5298, 10, 100);
            
            // Camera setup - adjusted for mobile
            const aspect = window.innerWidth / window.innerHeight;
            camera = new THREE.PerspectiveCamera(60, aspect, 0.1, 1000);
            camera.position.z = initialCameraZ;
            camera.position.y = 2;
            
            // Renderer setup
            renderer = new THREE.WebGLRenderer({ 
                canvas: document.getElementById('canvas'),
                antialias: true,
                alpha: true
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            
            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
            directionalLight.position.set(10, 10, 5);
            directionalLight.castShadow = true;
            scene.add(directionalLight);
            
            // Colorful point lights
            const pointLight1 = new THREE.PointLight(0xff00ff, 0.5, 20);
            pointLight1.position.set(-10, 5, 0);
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0x00ffff, 0.5, 20);
            pointLight2.position.set(10, 5, 0);
            scene.add(pointLight2);
            
            // Create all elements
            createGuitars();
            createPapaText();
            createBabyGirl();
            createStars();
            
            // Setup controls
            setupTouchControls();
            
            // Load audio automatically
            loadAudio();
        }
        
        function createGuitarShape() {
            const group = new THREE.Group();
            
            // Guitar body
            const bodyGeometry = new THREE.BoxGeometry(1.5, 2, 0.3);
            const bodyMaterial = new THREE.MeshPhongMaterial({
                color: 0x8B4513,
                shininess: 100
            });
            
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            group.add(body);
            
            // Rounded parts
            const curve1 = new THREE.CylinderGeometry(0.8, 0.8, 0.3, 16);
            const curve2 = new THREE.CylinderGeometry(0.6, 0.6, 0.3, 16);
            
            const curveBody1 = new THREE.Mesh(curve1, bodyMaterial);
            curveBody1.rotation.x = Math.PI / 2;
            curveBody1.position.y = -0.5;
            group.add(curveBody1);
            
            const curveBody2 = new THREE.Mesh(curve2, bodyMaterial);
            curveBody2.rotation.x = Math.PI / 2;
            curveBody2.position.y = 0.5;
            group.add(curveBody2);
            
            // Neck
            const neckGeometry = new THREE.BoxGeometry(0.3, 2, 0.1);
            const neck = new THREE.Mesh(neckGeometry, bodyMaterial);
            neck.position.y = 1.8;
            group.add(neck);
            
            // Headstock
            const headGeometry = new THREE.BoxGeometry(0.5, 0.5, 0.1);
            const head = new THREE.Mesh(headGeometry, bodyMaterial);
            head.position.y = 2.8;
            group.add(head);
            
            // Sound hole
            const holeGeometry = new THREE.RingGeometry(0.2, 0.4, 16);
            const holeMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x000000,
                side: THREE.DoubleSide
            });
            const hole = new THREE.Mesh(holeGeometry, holeMaterial);
            hole.position.z = 0.16;
            group.add(hole);
            
            // Strings
            const stringMaterial = new THREE.LineBasicMaterial({ color: 0xcccccc });
            for (let i = 0; i < 6; i++) {
                const points = [];
                points.push(new THREE.Vector3((i - 2.5) * 0.08, -1, 0.2));
                points.push(new THREE.Vector3((i - 2.5) * 0.08, 2.5, 0.2));
                const stringGeometry = new THREE.BufferGeometry().setFromPoints(points);
                const string = new THREE.Line(stringGeometry, stringMaterial);
                group.add(string);
            }
            
            return group;
        }
        
        function createGuitars() {
            const guitarColors = [0xff6b6b, 0x4ecdc4, 0xffe66d, 0x6a0dad, 0xff006e, 0x95e1d3, 0xf38181, 0xaa96da];
            
            for (let i = 0; i < 8; i++) {
                const guitar = createGuitarShape();
                
                // Circular arrangement
                const angle = (i / 8) * Math.PI * 2;
                const radius = 6; // Smaller for mobile
                guitar.position.x = Math.cos(angle) * radius;
                guitar.position.y = Math.sin(angle) * 2;
                guitar.position.z = Math.sin(angle) * radius;
                
                // Random rotation
                guitar.rotation.x = Math.random() * Math.PI * 2;
                guitar.rotation.y = Math.random() * Math.PI * 2;
                guitar.rotation.z = Math.random() * Math.PI * 2;
                
                // Add glow
                const glowMaterial = new THREE.MeshPhongMaterial({
                    color: guitarColors[i],
                    emissive: guitarColors[i],
                    emissiveIntensity: 0.3
                });
                
                guitar.traverse((child) => {
                    if (child.isMesh && child.material.color.getHex() === 0x8B4513) {
                        child.material = glowMaterial;
                    }
                });
                
                // Animation data
                guitar.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02,
                    (Math.random() - 0.5) * 0.02
                );
                guitar.userData.rotationSpeed = new THREE.Vector3(
                    Math.random() * 0.01,
                    Math.random() * 0.01,
                    Math.random() * 0.01
                );
                guitar.userData.originalPosition = guitar.position.clone();
                
                guitars.push(guitar);
                scene.add(guitar);
            }
        }
        
        function createPapaText() {
            const textGroup = new THREE.Group();
            
            const letterMaterial = new THREE.MeshPhongMaterial({
                color: 0xffd700,
                emissive: 0xffd700,
                emissiveIntensity: 0.5,
                shininess: 100
            });
            
            const letters = ['P', 'A', 'P', 'A'];
            const letterSpacing = 2;
            
            letters.forEach((letter, index) => {
                const letterGroup = new THREE.Group();
                
                if (letter === 'P') {
                    const vertical = new THREE.Mesh(
                        new THREE.BoxGeometry(0.3, 1.5, 0.3),
                        letterMaterial
                    );
                    vertical.position.x = -0.4;
                    letterGroup.add(vertical);
                    
                    const topBar = new THREE.Mesh(
                        new THREE.BoxGeometry(0.8, 0.3, 0.3),
                        letterMaterial
                    );
                    topBar.position.y = 0.6;
                    letterGroup.add(topBar);
                    
                    const midBar = new THREE.Mesh(
                        new THREE.BoxGeometry(0.8, 0.3, 0.3),
                        letterMaterial
                    );
                    letterGroup.add(midBar);
                    
                    const rightBar = new THREE.Mesh(
                        new THREE.BoxGeometry(0.3, 0.6, 0.3),
                        letterMaterial
                    );
                    rightBar.position.x = 0.4;
                    rightBar.position.y = 0.3;
                    letterGroup.add(rightBar);
                } else if (letter === 'A') {
                    const leftBar = new THREE.Mesh(
                        new THREE.BoxGeometry(0.3, 1.8, 0.3),
                        letterMaterial
                    );
                    leftBar.rotation.z = 0.15;
                    leftBar.position.x = -0.25;
                    letterGroup.add(leftBar);
                    
                    const rightBar = new THREE.Mesh(
                        new THREE.BoxGeometry(0.3, 1.8, 0.3),
                        letterMaterial
                    );
                    rightBar.rotation.z = -0.15;
                    rightBar.position.x = 0.25;
                    letterGroup.add(rightBar);
                    
                    const midBar = new THREE.Mesh(
                        new THREE.BoxGeometry(0.6, 0.3, 0.3),
                        letterMaterial
                    );
                    midBar.position.y = -0.2;
                    letterGroup.add(midBar);
                }
                
                letterGroup.position.x = (index - 1.5) * letterSpacing;
                textGroup.add(letterGroup);
            });
            
            textGroup.position.y = 4;
            textGroup.position.z = -2;
            textGroup.scale.set(0.8, 0.8, 0.8); // Smaller for mobile
            
            papaText = textGroup;
            scene.add(papaText);
        }
        
        function createBabyGirl() {
            const babyGroup = new THREE.Group();
            
            // Head
            const headGeometry = new THREE.SphereGeometry(0.8, 16, 16);
            const skinMaterial = new THREE.MeshPhongMaterial({
                color: 0xfdbcb4,
                shininess: 50
            });
            const head = new THREE.Mesh(headGeometry, skinMaterial);
            head.position.y = 0.5;
            babyGroup.add(head);
            
            // Hair
            const hairMaterial = new THREE.MeshPhongMaterial({
                color: 0x654321,
                shininess: 80
            });
            
            const hairGeometry = new THREE.SphereGeometry(0.85, 16, 16);
            const hair = new THREE.Mesh(hairGeometry, hairMaterial);
            hair.position.y = 0.8;
            hair.scale.set(1, 0.7, 1);
            babyGroup.add(hair);
            
            // Pigtails
            const pigtail1 = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 8, 8),
                hairMaterial
            );
            pigtail1.position.set(-0.8, 1, 0);
            babyGroup.add(pigtail1);
            
            const pigtail2 = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 8, 8),
                hairMaterial
            );
            pigtail2.position.set(0.8, 1, 0);
            babyGroup.add(pigtail2);
            
            // Bows
            const bowMaterial = new THREE.MeshPhongMaterial({
                color: 0xff1493,
                emissive: 0xff1493,
                emissiveIntensity: 0.2
            });
            
            const bow1 = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 0.2, 0.1),
                bowMaterial
            );
            bow1.position.set(-0.8, 1.1, 0.2);
            babyGroup.add(bow1);
            
            const bow2 = new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 0.2, 0.1),
                bowMaterial
            );
            bow2.position.set(0.8, 1.1, 0.2);
            babyGroup.add(bow2);
            
            // Eyes
            const eyeGeometry = new THREE.SphereGeometry(0.08, 8, 8);
            const eyeMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
            
            const eye1 = new THREE.Mesh(eyeGeometry, eyeMaterial);
            eye1.position.set(-0.2, 0.6, 0.7);
            babyGroup.add(eye1);
            
            const eye2 = new THREE.Mesh(eyeGeometry, eyeMaterial);
            eye2.position.set(0.2, 0.6, 0.7);
            babyGroup.add(eye2);
            
            // Smile
            const smileGeometry = new THREE.TorusGeometry(0.2, 0.05, 8, 8, Math.PI);
            const smileMaterial = new THREE.MeshBasicMaterial({ color: 0xff69b4 });
            const smile = new THREE.Mesh(smileGeometry, smileMaterial);
            smile.rotation.z = Math.PI;
            smile.position.set(0, 0.3, 0.7);
            babyGroup.add(smile);
            
            // Body/Dress
            const dressGeometry = new THREE.ConeGeometry(0.8, 1.5, 16);
            const dressMaterial = new THREE.MeshPhongMaterial({
                color: 0xff69b4,
                emissive: 0xff69b4,
                emissiveIntensity: 0.1
            });
            const dress = new THREE.Mesh(dressGeometry, dressMaterial);
            dress.position.y = -0.8;
            babyGroup.add(dress);
            
            // Arms
            const armGeometry = new THREE.CylinderGeometry(0.15, 0.15, 0.6);
            const arm1 = new THREE.Mesh(armGeometry, skinMaterial);
            arm1.position.set(-0.5, -0.3, 0);
            arm1.rotation.z = 0.5;
            babyGroup.add(arm1);
            
            const arm2 = new THREE.Mesh(armGeometry, skinMaterial);
            arm2.position.set(0.5, -0.3, 0);
            arm2.rotation.z = -0.5;
            babyGroup.add(arm2);
            
            babyGroup.position.set(0, -2, 2);
            babyGroup.scale.set(1.2, 1.2, 1.2);
            
            babyGirl = babyGroup;
            scene.add(babyGirl);
        }
        
        function createStars() {
            const starsGeometry = new THREE.BufferGeometry();
            const starsMaterial = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.1,
                transparent: true,
                opacity: 0.8
            });
            
            const starsVertices = [];
            for (let i = 0; i < 500; i++) {
                const x = (Math.random() - 0.5) * 80;
                const y = (Math.random() - 0.5) * 80;
                const z = (Math.random() - 0.5) * 80;
                starsVertices.push(x, y, z);
            }
            
            starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
            const stars = new THREE.Points(starsGeometry, starsMaterial);
            scene.add(stars);
        }
        
        function setupTouchControls() {
            // Touch events for mobile
            const canvas = renderer.domElement;
            
            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault();
                
                if (e.touches.length === 1) {
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    // Pinch zoom start
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    pinchStartDistance = Math.sqrt(dx * dx + dy * dy);
                }
            }, { passive: false });
            
            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                
                if (e.touches.length === 1) {
                    // Rotation
                    const deltaX = e.touches[0].clientX - touchStartX;
                    const deltaY = e.touches[0].clientY - touchStartY;
                    
                    targetRotationY += deltaX * 0.01;
                    targetRotationX += deltaY * 0.01;
                    
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                } else if (e.touches.length === 2 && pinchStartDistance > 0) {
                    // Pinch zoom
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    const scale = distance / pinchStartDistance;
                    camera.position.z = Math.max(10, Math.min(40, initialCameraZ / scale));
                }
            }, { passive: false });
            
            // Mouse events for desktop
            let mouseDown = false;
            
            canvas.addEventListener('mousedown', () => { mouseDown = true; });
            canvas.addEventListener('mouseup', () => { mouseDown = false; });
            canvas.addEventListener('mouseleave', () => { mouseDown = false; });
            
            canvas.addEventListener('mousemove', (e) => {
                if (!mouseDown) return;
                
                const deltaX = e.movementX;
                const deltaY = e.movementY;
                
                targetRotationY += deltaX * 0.01;
                targetRotationX += deltaY * 0.01;
            });
            
            canvas.addEventListener('wheel', (e) => {
                e.preventDefault();
                camera.position.z += e.deltaY * 0.01;
                camera.position.z = Math.max(10, Math.min(40, camera.position.z));
            }, { passive: false });
        }
        
        function loadAudio() {
            fetch('papa.mp3')
                .then(response => response.arrayBuffer())
                .then(data => {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    
                    audioContext.decodeAudioData(data, (buffer) => {
                        audioBuffer = buffer;
                        document.getElementById('loadingScreen').style.display = 'none';
                        
                        document.getElementById('playBtn').onclick = () => {
                            if (!isPlaying && audioBuffer) {
                                playAudio();
                            }
                        };
                    });
                })
                .catch(error => {
                    console.log('Audio file not found, continuing without music');
                    document.getElementById('loadingScreen').style.display = 'none';
                    document.getElementById('playBtn').textContent = '🎵 Keine Musik gefunden';
                    document.getElementById('playBtn').disabled = true;
                });
        }
        
        function playAudio() {
            if (!audioBuffer || isPlaying) return;
            
            audioSource = audioContext.createBufferSource();
            audioSource.buffer = audioBuffer;
            
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            audioData = new Uint8Array(analyser.frequencyBinCount);
            
            audioSource.connect(analyser);
            analyser.connect(audioContext.destination);
            
            audioSource.start(0);
            isPlaying = true;
            
            document.getElementById('playBtn').textContent = '🎵 Musik läuft...';
            
            // Update audio data
            function updateAudio() {
                if (isPlaying) {
                    analyser.getByteFrequencyData(audioData);
                    requestAnimationFrame(updateAudio);
                }
            }
            updateAudio();
            
            audioSource.onended = () => {
                isPlaying = false;
                document.getElementById('playBtn').textContent = '🎵 Nochmal abspielen';
            };
        }
        
        function animate() {
            requestAnimationFrame(animate);
            
            // Animate guitars
            guitars.forEach((guitar, index) => {
                guitar.position.add(guitar.userData.velocity);
                
                // Boundaries
                const maxDistance = 8;
                if (guitar.position.length() > maxDistance) {
                    guitar.userData.velocity.multiplyScalar(-1);
                }
                
                guitar.rotation.x += guitar.userData.rotationSpeed.x;
                guitar.rotation.y += guitar.userData.rotationSpeed.y;
                guitar.rotation.z += guitar.userData.rotationSpeed.z;
                
                // Audio reactivity
                if (analyser && audioData) {
                    const frequency = audioData[index * 16] / 255;
                    const scale = 1 + frequency * 0.5;
                    guitar.scale.setScalar(scale);
                    
                    guitar.position.x = guitar.userData.originalPosition.x + Math.sin(Date.now() * 0.001 + index) * 2 * frequency;
                    guitar.position.y = guitar.userData.originalPosition.y + Math.cos(Date.now() * 0.001 + index) * 2 * frequency;
                }
            });
            
            // Animate Papa text
            if (papaText) {
                papaText.rotation.y += 0.01;
                papaText.position.y = 4 + Math.sin(Date.now() * 0.002) * 0.5;
                
                if (analyser && audioData) {
                    const avgFrequency = audioData.reduce((a, b) => a + b) / audioData.length / 255;
                    const scale = 0.8 + avgFrequency * 0.3;
                    papaText.scale.set(scale, scale, scale);
                    
                    papaText.traverse((child) => {
                        if (child.isMesh) {
                            child.material.emissiveIntensity = 0.5 + avgFrequency * 0.5;
                        }
                    });
                }
            }
            
            // Animate baby girl
            if (babyGirl) {
                babyGirl.rotation.y = Math.sin(Date.now() * 0.001) * 0.2;
                babyGirl.position.x = Math.sin(Date.now() * 0.0015) * 0.5;
                
                if (analyser && audioData) {
                    const bassFrequency = audioData[2] / 255;
                    const midFrequency = audioData[Math.floor(audioData.length / 2)] / 255;
                    
                    babyGirl.position.y = -2 + Math.abs(Math.sin(Date.now() * 0.005)) * bassFrequency * 2;
                    babyGirl.rotation.z = Math.sin(Date.now() * 0.01) * midFrequency * 0.3;
                    
                    const scale = 1.2 + bassFrequency * 0.2;
                    babyGirl.scale.set(scale, scale, scale);
                }
            }
            
            // Camera movement
            scene.rotation.y += (targetRotationY - scene.rotation.y) * 0.05;
            scene.rotation.x += (targetRotationX - scene.rotation.x) * 0.05;
            
            // Clamp rotation
            scene.rotation.x = Math.max(-0.5, Math.min(0.5, scene.rotation.x));
            
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        }
        
        window.addEventListener('resize', onWindowResize);
        
        // Prevent zoom on iOS
        document.addEventListener('gesturestart', (e) => e.preventDefault());
        
        // Initialize and start
        init();
        animate();
    </script>
</body>
</html>
